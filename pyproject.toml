[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "research-backend"
version = "0.1.0"
description = "Codex, Claude Code and Antigravity behind one interface: models, usage limits, and sessions you can continue."
readme = "research_backend/README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2"]

# The agent (research_agent) also needs: langgraph, langgraph-checkpoint-sqlite, jsonschema;
# its web UI: fastapi, uvicorn[standard].

[project.optional-dependencies]
codex = ["openai-codex"]

[tool.setuptools.packages.find]
include = ["research_backend*", "research_agent*"]

[tool.setuptools.package-data]
research_agent = ["bootstrap/config.toml", "execute/config.toml", "web/static/*.html",
                  "web/static/css/*", "web/static/js/*", "web/static/vendor/*",
                  "prompts/*.md", "prompts/*/*.md", "prompts/*/*/*.md"]
