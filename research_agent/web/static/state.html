<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research State</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="state-window">
  <header class="topbar">
    <div class="brand"><span class="dot"></span>research state</div>
    <div class="run-bar">
      <span id="run-name" class="mono">-</span>
      <span id="run-phase" class="pill">-</span>
      <span id="run-activity" class="activity"></span>
    </div>
    <div class="topbar-actions"><span id="live-dot" class="live-dot" title="live"></span></div>
  </header>
  <main class="state-page"><div id="state-view" class="state-view"></div></main>
  <script type="module" src="/js/statewin.js"></script>
</body>
</html>
