# The bootstrap's configuration: which model each role runs on, and which
# skills each node is given.
#
# This file holds the defaults. A run copies what it starts with into
# <run>/config.json -- edit that to change one run (it is read again on
# --resume) -- and the command line overrides both for one start:
#     --role designer=codex:gpt-5.6-sol:high
#     --skills designer=experiment-design,ml-statistics
#     --skills-dir ~/my_skills


[skills]
# Where the skills are: a folder of <name>/SKILL.md. A relative path is from
# the repository root (the folder that holds research_agent/).
dir = "skills"

# What each node is given:
#   "none"               no skills
#   "auto"               the name, description and path of every skill; the
#                        model reads the ones its task needs (never by default)
#   ["a", "b"]           those skills, in full
# Each role's skills by default come from the run's field
# (research_agent/fields/<field>/field.toml): assigned skills, or none.
# Set one here, or in a run's config.json, to override it.


[research]
# The literature sources the research skill may search: openalex (every
# field), s2 (Semantic Scholar; needs SEMANTIC_SCHOLAR_API_KEY), pubmed,
# europepmc, scholar (Google Scholar through SerpAPI; needs SERPAPI_API_KEY,
# and each search costs a credit). A source not listed is never asked. The
# researcher node's window in the web UI changes this for one run.
sources = ["openalex", "s2"]


# Which provider and model each role runs on. `model` is an id from
# RB.list_models(provider); leave it out for the provider's default.
# `effort` is a level from RB.list_efforts(provider) -- not for antigravity,
# whose model ids carry the level themselves (gemini-3.8-flash-high).
# `options` go to the provider: timeout, max_seconds, ...
# `backup` is what the role moves to, in order, when its model is out of
# credits or cannot be reached: "provider[:model[:effort]]" each. The call
# moves on at once (the model does not wait for its credits) and the model is
# benched until its limit resets -- the time the provider names, else an
# hour. The last one waits for credits as usual. A conversation (the
# discussor's) moved to a backup is handed over, as when you change its
# provider. Without `backup`, a model out of credits waits up to a day.
#     backup = ["codex_strata:strata", "claude_code:sonnet"]

[roles.discussor]
provider = "codex"
model = "gpt-6.1-sol"

[roles.orchestrator]
provider = "codex"
model = "gpt-6.1-sol"

[roles.researcher]
provider = "antigravity"
model = "gemini-3.8-flash-high"

[roles.designer]
provider = "codex"
model = "gpt-6.1-terra"
effort = "high"
